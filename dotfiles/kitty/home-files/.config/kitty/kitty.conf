# *Basics*

shell sh -c "command -v fish >/dev/null && exec fish -i || exec bash -i"
editor .
# Use `kitty +kitten ssh' to install terminfo for the first time
term xterm-kitty
terminfo_type path

# Copying and pasting
copy_on_select yes
paste_actions quote-urls-at-prompt,confirm
strip_trailing_spaces always
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

# Scrolling
scrollback_lines 9999
scrollback_indicator_opacity 0.9
scrollback_pager_history_size 5
wheel_scroll_multiplier 3.0
wheel_scroll_min_lines 1

# Links
allow_hyperlinks yes
detect_urls yes
show_hyperlink_targets yes
underline_hyperlinks hover

# Integration
shell_integration enabled
remote_kitty if-needed

# SSH
share_connections yes
askpass native

# Misc
update_check_interval 0


# *Linux*

linux_display_server auto
wayland_titlebar_color background
wayland_enable_ime yes


# *MacOS*

macos_titlebar_color background
macos_option_as_alt left
macos_quit_when_last_window_closed yes


# *Appearance*

# Fonts - Size in pts
font_size 16.0
font_family family="Iosevka Term" style=Medium
bold_font auto
italic_font auto
bold_italic_font auto
disable_ligatures cursor

# Cursor
cursor_shape block
cursor_shape_unfocused hollow
cursor_blink_interval 0
# cursor_trail 500
# cursor_trail_decay 0.1 0.2
# cursor_trail_start_threshold 2

# UI
enabled_layouts splits,tall,fat,grid,stack

remember_window_position no
remember_window_size no
initial_window_width 900
initial_window_height 600
draw_minimal_borders yes
window_border_width 1pt
window_margin_width 0
window_padding_width 5

tab_bar_edge bottom
tab_bar_margin_width 0.0
tab_bar_margin_height 0.0 0.0
tab_bar_style slant
tab_bar_align left
tab_bar_min_tabs 2
tab_switch_strategy previous
tab_title_max_length 30

background_opacity 1
background_blur 8
dynamic_background_opacity yes


# *Keybindings*

clear_all_shortcuts yes
kitty_mod ctrl+shift

# Hint mode
map --new-mode hint_mode --on-unknown end --on-action end kitty_mod+x
map --mode hint_mode u  kitten hints --type url --program @
map --mode hint_mode p  kitten hints --type path --program @
map --mode hint_mode l  kitten hints --type line --program @
map --mode hint_mode w  kitten hints --type word --program @
map --mode hint_mode r  kitten hints --type regex --program @
map --mode hint_mode i  kitten hints --type ip --program @
map --mode hint_mode c  kitten hints --type hash --program @
map --mode hint_mode h  kitten hints --type hyperlink --program @

# Scrolling mode
map kitty_mod+z  show_scrollback
map kitty_mod+e  launch --stdin-source=@screen_scrollback --type=overlay vim -c "nnoremap <C-c> ZQ" -
# TODO: Might not needed
# map --new-mode scrolling_mode --on-unknown ignore kitty_mod+z
# map --mode scrolling_mode k           scroll_line_up
# map --mode scrolling_mode ctrl+y      scroll_line_up
# map --mode scrolling_mode up          scroll_line_up
# map --mode scrolling_mode j           scroll_line_down
# map --mode scrolling_mode ctrl+e      scroll_line_down
# map --mode scrolling_mode down        scroll_line_down
# map --mode scrolling_mode h           scroll_page_up
# map --mode scrolling_mode ctrl+b      scroll_page_up
# map --mode scrolling_mode left        scroll_page_up
# map --mode scrolling_mode page_up     scroll_page_up
# map --mode scrolling_mode l           scroll_page_down
# map --mode scrolling_mode ctrl+f      scroll_page_down
# map --mode scrolling_mode right       scroll_page_down
# map --mode scrolling_mode page_down   scroll_page_down
# map --mode scrolling_mode g           scroll_home
# map --mode scrolling_mode home        scroll_home
# map --mode scrolling_mode G           scroll_end
# map --mode scrolling_mode end         scroll_end
# map --mode scrolling_mode z           scroll_to_prompt -1
# map --mode scrolling_mode ctrl+up     scroll_to_prompt -1
# map --mode scrolling_mode ctrl+left   scroll_to_prompt -1
# map --mode scrolling_mode x           scroll_to_prompt 1
# map --mode scrolling_mode ctrl+down   scroll_to_prompt 1
# map --mode scrolling_mode ctrl+right  scroll_to_prompt 1
# map --mode scrolling_mode esc         pop_keyboard_mode
# map --mode scrolling_mode q           pop_keyboard_mode
# map --mode scrolling_mode ctrl+g      pop_keyboard_mode

map kitty_mod+i  kitten unicode_input
map kitty_mod+c  copy_to_clipboard
map kitty_mod+v  paste_from_clipboard

# Windows
map kitty_mod+1      toggle_layout stack
map kitty_mod+2      launch --type window --location=hsplit --cwd=current
map kitty_mod+3      launch --type window --location=vsplit --cwd=current
map kitty_mod+enter  launch --type window --location=split --cwd=current
map kitty_mod+q      close_window
map kitty_mod+j      next_window
map kitty_mod+k      previous_window
map kitty_mod+alt+t  detach_window new-tab
map kitty_mod+alt+r  set_window_title
# Resizing and swapping
map kitty_mod+4         start_resizing_window
map kitty_mod+left      resize_window narrower
map kitty_mod+right     resize_window wider
map kitty_mod+up        resize_window taller
map kitty_mod+down      resize_window shorter
map kitty_mod+alt+down  resize_window reset
map kitty_mod+g         focus_visible_window
map kitty_mod+alt+g     swap_with_window
map kitty_mod+alt+j     move_window_forward
map kitty_mod+alt+k     move_window_backward
map kitty_mod+y         next_layout

### Tabs
map kitty_mod+l     next_tab
map ctrl+tab        next_tab
map kitty_mod+h     previous_tab
map ctrl+shift+tab  previous_tab
map kitty_mod+t     new_tab
map kitty_mod+w     close_tab
map kitty_mod+.     move_tab_forward
map kitty_mod+,     move_tab_backward
map kitty_mod+r     set_tab_title

### Frames
map kitty_mod+n    new_os_window
map alt+f4         close_os_window
map kitty_mod+f11  toggle_fullscreen
map alt+enter      toggle_fullscreen

### Display
map kitty_mod+equal      change_font_size       all +1.0
map kitty_mod+minus      change_font_size       all -1.0
map kitty_mod+0          change_font_size       all 0
map kitty_mod+alt+equal  set_background_opacity +0.1
map kitty_mod+alt+minus  set_background_opacity -0.1
map kitty_mod+alt+0      set_background_opacity default

### Debugging
map kitty_mod+escape  kitty_shell window
map kitty_mod+p       command_palette
map kitty_mod+f2      edit_config_file
map kitty_mod+f5      load_config_file
map kitty_mod+f6      debug_config


# *Theme*

# Note that when using `kitten themes' a new file `current-theme.conf' is
# generated, which overrides `default-theme.conf'.  To make it effective, use
# the keybinding for `load_config_file' to reload the config.
include default-theme.conf
include current-theme.conf
# Local override
include kitty-override.conf
