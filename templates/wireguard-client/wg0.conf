## Generate key pair
##   $ wg genkey | tee private.key | wg pubkey > public.key
##
## Ad-hoc interface up
##   $ sudo wg-quick up /PATH/TO/THIS/wg0.conf
##
## Ad-hoc interface down
##   $ sudo wg-quick down /PATH/TO/THIS/wg0.conf
##
## NOTE: the file name implies the interface name

[Interface]
Address = 10.100.0.5/32
PrivateKey = PRIVATE_KEY
DNS = 1.1.1.1

[Peer]
Endpoint = SERVER_IP_OR_DOMAIN:PORT
PublicKey = PUBLIC_KEY
AllowedIPs = 0.0.0.0/0
PersistentKeepAlive = 20
